[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanogenesis-bench"
version = "0.1.0.dev1"
description = "Developer-preview benchmark for autonomous physical research and device construction"
requires-python = ">=3.11"
authors = [{name = "DataFlux Dynamics"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mbench = "mechanogenesis_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
