name: benchmark-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark
        run: python -m pip install -e '.[dev]'
      - name: Build Lean verification kernel
        run: |
          lake build sovereignCheck promotionCheck canonicalIRCheck \
            metrologyCheck comparatorCheck pipeCheck evidenceActionCheck \
            diagnosticCheck generalizationCheck demandMicrofactoryCheck
      - name: Run Python regression and adapter tests
        run: python -m pytest -q
      - name: Execute the deterministic non-canned baseline
        run: |
          mbench run tasks/conformance/generated_metrology_fixture \
            --system-command "python examples/generated_fixture_search_system.py" \
            --guidance G5 \
            --output /tmp/mbench-generated-fixture-reference
          mbench verify /tmp/mbench-generated-fixture-reference
          mbench score /tmp/mbench-generated-fixture-reference
      - name: Execute the two-generation demand microfactory baseline
        run: |
          mbench run tasks/simulation/demand_driven_microfactory \
            --system-command "python examples/reference_demand_microfactory_system.py" \
            --guidance G5 \
            --output /tmp/mbench-demand-microfactory-reference
          mbench verify /tmp/mbench-demand-microfactory-reference
          mbench score /tmp/mbench-demand-microfactory-reference
